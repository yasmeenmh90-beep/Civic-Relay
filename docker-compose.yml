services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicrelay
      POSTGRES_PASSWORD: civicrelay
      POSTGRES_DB: civicrelay
    volumes:
      - civicrelay_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicrelay"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://civicrelay:civicrelay@db:5432/civicrelay
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENABLE_DEV_ROUTES: ${ENABLE_DEV_ROUTES:-1}
      RUN_BACKGROUND_SCHEDULER: ${RUN_BACKGROUND_SCHEDULER:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Optional - only needed for real Bedrock/S3/municipal API integration:
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      MUNICIPAL_API_BASE_URL: ${MUNICIPAL_API_BASE_URL:-}
      MUNICIPAL_API_KEY: ${MUNICIPAL_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  civicrelay_pgdata:
